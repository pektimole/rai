# RAI ActionGate policy: Claude Code shell adapter
# Hook: PreToolUse on Bash tool calls
# Expand by appending to this file, never by code change.

version: 1
adapter: shell
fail_closed: false  # blocklist mode: allow unless explicitly blocked

blocked_commands:
  - shutdown
  - reboot
  - mkfs
  - dd

blocked_patterns:
  - "git push --force"
  - "git push -f"
  - "git reset --hard"
  - "--no-verify"
  - "rm -rf /"
  - "rm -rf ~"
  - "> /dev/"
  # External code execution: screen the source first (clone to scratch, read, rai_scan), then run it by hand.
  - "\\|\\s*(sudo\\s+)?(ba|z|da)?sh(\\s|$)"
  - "claude\\s+plugin\\s+install\\s+(?!no5-[a-z]+@local-mods)"
  - "claude\\s+plugin\\s+marketplace\\s+add\\s+(?!/Users/ich/\\.claude/local-mods)"
  - "--plugin-dir"
  - "npx\\s+(-y|--yes)\\b"

# --- Confirm-required (ask) classes — ActionGate gap #2, finding 2026-11-22 ---
# These do NOT block; they route to Claude Code's native human confirm (ask).
# Hidden / covert mail recipients: data exfil via bcc/cc, raw SMTP, python smtplib.
ask_patterns:
  - "\\bmailx?\\s+[^|&;]*-[bc]\\b"      # mail -b / mail -c (bcc/cc recipient)
  - "[Bb][Cc][Cc]:\\s*\\S+@"            # sendmail/piped message carrying a Bcc: header
  - "--mail-rcpt\\b"                    # curl covert SMTP recipient
  - "\\bsmtplib\\b"                     # python smtplib send

# Persistence surfaces: a write here survives the session / re-runs on login/commit.
# Matched against both shell command strings and file-write (Write/Edit/MultiEdit) targets.
persistence_path_patterns:
  - "(?:^|/)\\.(zshrc|zprofile|zshenv|zlogin|bashrc|bash_profile|bash_login|profile)\\b"
  - "(?:~|/Users/[^/]+|/home/[^/]+)/bin\\b"   # ~/bin on PATH
  - "Library/LaunchAgents\\b"                 # macOS login persistence
  - "\\.git/hooks\\b"                         # repo-local hook persistence
  - "\\.claude/settings[^/]*\\.json\\b"       # Claude Code hook/permission config

# No working dir restriction for now (Claude Code operates in project dir)
