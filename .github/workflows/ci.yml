name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # @rai/core imports @rai/p2-agent, but npm runs workspace scripts in the
      # order listed in package.json (core first). Build p2-agent up front so a
      # clean checkout can resolve its type declarations.
      - name: Build @rai/p2-agent (dependency of @rai/core)
        run: npm run build -w @rai/p2-agent

      - name: Build all workspaces
        run: npm run build

      - name: Test all workspaces
        run: npm test
